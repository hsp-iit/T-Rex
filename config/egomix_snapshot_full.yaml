# Full snapshot views (utils/egomix_snapshot.py): all six egomix outputs, the original selection plus the
# replacement runs (132,594 episodes, ~51 M frames, 1,416 h). Its own view_dir (own lock, cache and plans), so it
# never touches /fastwork/lgori/egomix_snapshot (the 14 Nov snapshot of the running EgoMix pretraining).
#   sbatch --export=ALL,CONFIG=/home/lgori/trex-mod/config/egomix_snapshot_full.yaml scripts/egomix_snapshot.sh
#   SNAPSHOT=/fastwork/lgori/egomix_snapshot_full/retarget ... pretrain_4gpu.sbatch   # (--local-copy of it)
sources:                                          # egomix output folders (read only)
  - /fastwork/lgori/egomix_10tb                   # main GPU run (hoi4d, egodex, egopro, egostandard)
  - /fastwork/lgori/egomix_10tb_egoverse_gpu      # EgoVerse A (half 0)
  - /fastwork/lgori/egomix_10tb_egoverse_gpu_b    # EgoVerse B (half 1)
  - /fastwork/lgori/egomix_10tb_replace_egostandard  # replacements (EgoStandard)
  - /fastwork/lgori/egomix_10tb_replace_egoverse  # replacements for A
  - /fastwork/lgori/egomix_10tb_replace_egoverse_b  # replacements for B
view_dir: /fastwork/lgori/egomix_snapshot_full
modes: [retarget]
settle_seconds: 300
world_up:                                         # skip EgoVerse worlds that are not gravity up (drop_episodes.py)
  recheck: true
  python: /home/lgori/.conda/envs/egomix/bin/python
  egomix_dir: /home/lgori/egomix
  sim_repo: /home/lgori/panda-sim
